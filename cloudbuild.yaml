steps:
    # Build the Docker image
    - name: "gcr.io/cloud-builders/docker"
      args:
          - "build"
          - "-t"
          - "gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"
          - "-t"
          - "gcr.io/$PROJECT_ID/lavoro:latest"
          - "."

    # Push the image to Container Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          - "push"
          - "gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"

    # Deploy to Cloud Run
    - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
      entrypoint: gcloud
      args:
          - "run"
          - "deploy"
          - "${_SERVICE_NAME}"
          - "--image=gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"
          - "--region=${_REGION}"
          - "--platform=managed"
          - "--allow-unauthenticated"
          - "--set-env-vars=NODE_ENV=production,DATABASE_URL=sqlite:///app/data/lavoro.db,GEMINI_MODEL=gemini-3-flash-preview"

images:
    - "gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"
    - "gcr.io/$PROJECT_ID/lavoro:latest"

options:
    machineType: "N1_HIGHCPU_8"

substitutions:
    _REGION: "us-central1"
    _SERVICE_NAME: "lavoro"
