steps:
    # Build the Docker image
    - name: "gcr.io/cloud-builders/docker"
      args:
          - "build"
          - "-t"
          - "gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"
          - "-t"
          - "gcr.io/$PROJECT_ID/lavoro:latest"
          - "."

    # Push the image to Container Registry
    - name: "gcr.io/cloud-builders/docker"
      args:
          - "push"
          - "gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"

    # Deploy to Cloud Run
    - name: "gcr.io/cloud-builders/gke-deploy"
      args:
          - run
          - --filename=.
          - --image=gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA
          - --location=us-central1
          - --config=cloud-run-deployment.yaml

images:
    - "gcr.io/$PROJECT_ID/lavoro:$SHORT_SHA"
    - "gcr.io/$PROJECT_ID/lavoro:latest"

options:
    machineType: "N1_HIGHCPU_8"

substitutions:
    _REGION: "us-central1"
    _SERVICE_NAME: "lavoro"
