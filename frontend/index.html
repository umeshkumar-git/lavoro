<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Developer Mentor AI</title>
		<link rel="stylesheet" href="style.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="app-shell">
			<aside class="sidebar">
				<div class="brand">
					<div class="logo"><i class="fas fa-code"></i></div>
					<div>
						<strong>Developer Mentor AI</strong>
						<span>Engineering tutor</span>
					</div>
				</div>

				<section class="panel-section">
					<h2>Modes</h2>
					<div id="modeList" class="mode-list"></div>
				</section>

				<section class="panel-section">
					<h2>Level</h2>
					<select id="levelSelect">
						<option value="beginner">Beginner</option>
						<option value="intermediate" selected>Intermediate</option>
						<option value="advanced">Advanced</option>
						<option value="interview">Interview</option>
					</select>
				</section>

				<section class="panel-section">
					<h2>Teaching</h2>
					<select id="teachingSelect">
						<option value="direct" selected>Direct</option>
						<option value="socratic">Socratic</option>
						<option value="beginner">Beginner</option>
						<option value="expert">Expert</option>
					</select>
				</section>

				<div class="sidebar-actions">
					<button id="newChatBtn" class="secondary-btn">
						<i class="fas fa-rotate-right"></i>
						New chat
					</button>
					<button id="themeToggle" class="icon-btn" aria-label="Toggle theme">
						<i class="fas fa-moon"></i>
					</button>
				</div>
			</aside>

			<main class="main-workspace">
				<header class="topbar">
					<div>
						<p class="eyebrow">Personal AI for software-development students</p>
						<h1>Think, debug, review, and build like an engineer.</h1>
					</div>
					<div id="healthBadge" class="health-badge">Checking backend</div>
				</header>

				<section class="chat-panel">
					<div id="chatMessages" class="chat-messages"></div>

					<div id="attachmentTray" class="attachment-tray" hidden></div>

					<form id="chatForm" class="composer">
						<textarea
							id="userInput"
							rows="3"
							placeholder="Ask about code, debugging, architecture, interviews, or paste a snippet..."
						></textarea>
						<div class="composer-actions">
							<label class="secondary-btn attach-btn" for="fileInput">
								<i class="fas fa-paperclip"></i>
								Attach code
							</label>
							<input id="fileInput" type="file" multiple hidden />
							<label class="checkbox-row">
								<input id="includeProject" type="checkbox" />
								<span>Use project context</span>
							</label>
							<button id="stopBtn" type="button" class="secondary-btn" disabled>
								<i class="fas fa-stop"></i>
								Stop
							</button>
							<button id="sendBtn" type="submit" class="primary-btn">
								<i class="fas fa-paper-plane"></i>
								Send
							</button>
						</div>
					</form>
				</section>
			</main>

			<aside class="context-panel">
				<section>
					<h2>Student Profile</h2>
					<form id="profileForm" class="profile-form">
						<label>
							Experience
							<input id="profileExperience" name="experienceLevel" />
						</label>
						<label>
							Languages
							<input id="profileLanguages" name="languages" />
						</label>
						<label>
							Goal
							<input id="profileGoal" name="goal" />
						</label>
						<label>
							Current project
							<input id="profileProject" name="currentProject" />
						</label>
						<button class="secondary-btn" type="submit">
							<i class="fas fa-save"></i>
							Save profile
						</button>
					</form>
				</section>

				<section>
					<h2>Workspace</h2>
					<div id="projectSummary" class="workspace-summary">Loading project...</div>
				</section>

				<section>
					<h2>Quick Starts</h2>
					<div class="quick-list">
						<button data-prompt="Explain React useEffect dependencies at an intermediate level.">React hooks</button>
						<button data-prompt="Debug this error: Cannot read properties of undefined. Teach me how to reason about it.">Debug error</button>
						<button data-prompt="Review this function for correctness, performance, security, and tests.">Code review</button>
						<button data-prompt="Create a project plan for a full-stack expense tracker.">Project plan</button>
						<button data-prompt="Run a JavaScript interview question. Do not reveal the answer first.">Interview drill</button>
					</div>
				</section>
			</aside>
		</div>
		<script src="script.js"></script>
	</body>
</html>
