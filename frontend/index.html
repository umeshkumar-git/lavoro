<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lavoro: Personal Daily Assistant</title>
		<link rel="stylesheet" href="style.css" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="page-shell">
			<div class="app-shell">
				<header class="app-header">
					<div class="brand-lockup">
						<img
							src="/lavoro-logo.png"
							alt="Lavoro logo"
							class="brand-logo"
						/>
						<div>
							<p class="header-kicker">Good morning, Umesh</p>
							<h1>Lavoro: Personal Daily Assistant</h1>
						</div>
					</div>
					<div id="healthBadge" class="health-badge" role="status">
						<span class="status-dot"></span>
						Checking backend
					</div>
				</header>

				<main class="dashboard" aria-live="polite">
					<nav class="quick-actions" aria-label="Quick actions">
						<button
							class="quick-action active"
							type="button"
							data-view="briefing"
							aria-pressed="true"
						>
							<span class="action-icon" aria-hidden="true"
								>📅</span
							>
							<span>Morning Briefing</span>
						</button>
						<button
							class="quick-action"
							type="button"
							data-view="email"
							aria-pressed="false"
						>
							<span class="action-icon" aria-hidden="true"
								>📧</span
							>
							<span>Email Summary</span>
						</button>
						<button
							class="quick-action"
							type="button"
							data-view="tasks"
							aria-pressed="false"
						>
							<span class="action-icon" aria-hidden="true"
								>⭐</span
							>
							<span>Prioritize Tasks</span>
						</button>
						<button
							class="quick-action"
							type="button"
							data-view="planner"
							aria-pressed="false"
						>
							<span class="action-icon" aria-hidden="true"
								>🗓️</span
							>
							<span>Plan My Day</span>
						</button>
					</nav>

					<section
						id="contentArea"
						class="content-area"
						aria-label="Assistant dashboard"
					>
						<div class="loading-card">Loading your day...</div>
					</section>

					<section class="chat-panel" aria-labelledby="chatTitle">
						<div class="chat-panel-header">
							<div>
								<p class="section-label">AI Assistant</p>
								<h2 id="chatTitle">Ask about your day</h2>
							</div>
							<button
								id="resetChatBtn"
								class="secondary-btn"
								type="button"
							>
								<i
									class="fas fa-rotate-right"
									aria-hidden="true"
								></i>
								Reset Chat
							</button>
						</div>

						<div
							id="chatMessages"
							class="chat-messages"
							role="log"
							aria-live="polite"
							aria-label="Chat messages"
						></div>
						<div
							id="attachmentTray"
							class="attachment-tray"
							hidden
						></div>

						<form id="chatForm" class="composer">
							<label class="sr-only" for="userInput"
								>Ask me anything about your day</label
							>
							<textarea
								id="userInput"
								rows="1"
								placeholder="Ask me anything about your day..."
							></textarea>
							<div class="composer-actions">
								<label class="attach-btn" for="fileInput">
									<i
										class="fas fa-paperclip"
										aria-hidden="true"
									></i>
									Attach
								</label>
								<input
									id="fileInput"
									type="file"
									multiple
									hidden
								/>
								<label class="checkbox-row">
									<input
										id="includeProject"
										type="checkbox"
									/>
									<span>Use project context</span>
								</label>
								<button
									id="sendBtn"
									class="primary-btn"
									type="submit"
								>
									<i
										class="fas fa-paper-plane"
										aria-hidden="true"
									></i>
									Send
								</button>
							</div>
						</form>
					</section>
				</main>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
