<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Lavoro | AI Productivity Agent</title>
		<link rel="stylesheet" href="style.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div class="app-container">
			<!-- Animated Background -->
			<div class="bg-animation">
				<div class="floating-shapes">
					<div class="shape shape-1"></div>
					<div class="shape shape-2"></div>
					<div class="shape shape-3"></div>
					<div class="shape shape-4"></div>
				</div>
			</div>

			<!-- Main App Layout -->
			<div class="app-layout">
				<!-- Modern Sidebar -->
				<aside class="sidebar">
					<div class="sidebar-header">
						<div class="brand">
							<div class="logo-container">
								<i class="fas fa-brain"></i>
							</div>
							<div class="brand-info">
								<span class="brand-name">Lavoro</span>
								<span class="brand-subtitle">AI Assistant</span>
							</div>
						</div>
					</div>

					<nav class="agent-nav">
						<div class="nav-section">
							<i class="fas fa-tasks"></i>
							<span>Active Tasks</span>
						</div>
						<ul id="taskList">
							<li class="task-item active">
								<i class="fas fa-sun"></i>
								<span>Daily Briefing</span>
							</li>
							<li class="task-item">
								<i class="fas fa-envelope"></i>
								<span>Email Triage</span>
							</li>
							<li class="task-item">
								<i class="fas fa-calendar"></i>
								<span>Schedule</span>
							</li>
						</ul>
					</nav>

					<div class="system-status">
						<div class="status-indicator online"></div>
						<span>Agent Online</span>
						<div class="status-pulse"></div>
					</div>
				</aside>

				<!-- Main Content -->
				<main class="main-content">
					<header class="app-header">
						<div class="header-info">
							<h1>
								<i class="fas fa-magic"></i>
								Morning Briefing
							</h1>
							<p class="subtitle">
								<i class="fas fa-robot"></i>
								Your Personal AI Assistant
							</p>
						</div>
						<div class="header-actions">
							<button class="theme-toggle" id="themeToggle">
								<i class="fas fa-sun"></i>
								<i class="fas fa-moon"></i>
							</button>
							<button
								class="btn-modern reset-btn"
								onclick="resetChat()"
							>
								<i class="fas fa-refresh"></i>
								Reset Session
							</button>
						</div>
					</header>

					<div class="dashboard-grid">
						<section class="chat-section">
							<div class="chat-container">
								<div id="chatMessages" class="chat-messages">
									<div class="welcome-message">
										<div class="welcome-icon">
											<i class="fas fa-wave"></i>
										</div>
										<div class="welcome-text">
											<h3>Hello! I'm Lavoro</h3>
											<p>
												How can I streamline your
												workflow today?
											</p>
										</div>
									</div>
								</div>

								<div class="input-wrapper">
									<div class="quick-chips">
										<button
											class="chip-btn"
											onclick="
												quickAction('Morning briefing')
											"
										>
											<i class="fas fa-calendar-day"></i>
											<span>Briefing</span>
										</button>
										<button
											class="chip-btn"
											onclick="
												quickAction('Email summary')
											"
										>
											<i class="fas fa-envelope-open"></i>
											<span>Emails</span>
										</button>
										<button
											class="chip-btn"
											onclick="
												quickAction('Prioritize tasks')
											"
										>
											<i class="fas fa-star"></i>
											<span>Tasks</span>
										</button>
										<button
											class="chip-btn"
											onclick="
												quickAction('Schedule review')
											"
										>
											<i class="fas fa-clock"></i>
											<span>Schedule</span>
										</button>
									</div>

									<div class="input-container">
										<div class="input-group">
											<input
												type="text"
												id="userInput"
												placeholder="Ask Lavoro anything..."
												onkeypress="
													handleKeyPress(event)
												"
											/>
											<button
												id="sendBtn"
												class="send-btn"
												onclick="sendMessage()"
											>
												<i
													class="fas fa-paper-plane"
												></i>
											</button>
										</div>
									</div>
								</div>
							</div>
						</section>
					</div>
				</main>
			</div>
		</div>
		<script src="script.js"></script>
	</body>
</html>
