app = "lavoro"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "lavoro_data"
  destination = "/app/data"

[env]
  NODE_ENV = "production"
  PORT = "10000"
  DATABASE_URL = "sqlite:///app/data/lavoro.db"
